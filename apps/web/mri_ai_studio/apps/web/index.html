<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MRI AI STUDIO · Radiology Workstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <!--
    To point the frontend at a different backend host, add this BEFORE the stylesheet:
      <script>window.API_BASE_URL = "http://127.0.0.1:18008";</script>
  -->
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="shell">

  <!-- ── Top Bar ── -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-logo">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.4"/>
          <line x1="8" y1="2" x2="8" y2="5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="8" y1="10.5" x2="8" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="8" x2="5.5" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="10.5" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">MRI AI STUDIO</span>
        <span class="brand-sub">developed by ZIYANG</span>
      </div>
    </div>
    <div class="topbar-case" id="summary-strip"></div>
    <div class="topbar-right">
      <div class="topbar-progress">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <span class="progress-label" id="progress-label">0/0</span>
      </div>
      <div class="conn-badge" id="health-badge">
        <span class="conn-dot"></span>
        <span id="conn-label">connecting</span>
      </div>
      <div class="src-tag" id="source-badge">loading</div>
    </div>
  </header>

  <!-- ── Workspace ── -->
  <main class="workspace">

    <!-- Chat Panel -->
    <section class="panel chat-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="eyebrow">Conversation</span>
          <h2>Chat</h2>
        </div>
      </div>
      <div id="chat-history" class="chat-history"></div>
      <div class="chat-footer">
        <div class="chat-quick-actions">
          <button id="send-patch" class="qbtn" type="button">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Insert Checkpoint
          </button>
        </div>
        <textarea id="chat-input" rows="3" placeholder="Describe what the workstation should do… (Ctrl+Enter to send)"></textarea>
        <div class="chat-send-row">
          <span class="hint-text">Ctrl+Enter</span>
          <button id="chat-submit" class="btn-primary" type="button">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 6.5h11M7 2.5l4.5 4L7 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Send
          </button>
        </div>
      </div>
    </section>

    <!-- Resize: chat | center -->
    <div class="resize-col" id="resize-col-left" title="Drag to resize"></div>

    <!-- Center Column -->
    <div class="center-column">
      <section class="panel graph-panel">
        <div class="panel-header">
          <div class="panel-title">
            <span class="eyebrow">Action Graph</span>
            <h2>Pipeline</h2>
          </div>
          <div class="panel-header-actions">
            <div id="graph-meta" class="graph-meta"></div>
            <div class="cbtn-divider"></div>
            <button id="execute-next" class="cbtn cbtn-accent" type="button">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><polygon points="1,1 9,5 1,9" fill="currentColor"/></svg>
              Execute Next
            </button>
            <button id="apply-latest-proposal" class="cbtn" type="button">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Apply Proposal
            </button>
            <button id="reset-demo" class="cbtn cbtn-danger" type="button">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 6A4.5 4.5 0 1 1 3.7 9.6M1.5 3v3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Reset
            </button>
          </div>
        </div>
        <div class="reflector-banner hidden" id="reflector-banner"></div>
        <div class="pipeline-strip" id="pipeline-strip"></div>
        <div id="graph-canvas" class="graph-canvas"></div>
      </section>

      <!-- Resize: graph | viewer -->
      <div class="resize-row" id="resize-row-center" title="Drag to resize"></div>

      <section class="panel viewer-panel">
        <div class="panel-header">
          <div class="panel-title">
            <span class="eyebrow">Visual Evidence</span>
            <h2>Viewer</h2>
          </div>
        </div>
        <div class="viewer-body">
          <div id="artifact-preview" class="artifact-preview"></div>
          <aside class="artifact-rail">
            <div class="rail-section-label">Linked Artifacts</div>
            <div id="artifact-list" class="artifact-list"></div>
          </aside>
        </div>
      </section>
    </div><!-- /center-column -->

    <!-- Resize: center | inspector -->
    <div class="resize-col" id="resize-col-right" title="Drag to resize"></div>

    <!-- Inspector Panel -->
    <section class="panel inspector-panel">
      <div class="panel-header insp-header">
        <div class="insp-title-row">
          <div class="panel-title">
            <span class="eyebrow">Details</span>
            <h2>Inspector</h2>
          </div>
        </div>
        <div class="tab-bar" id="inspector-tabs" role="tablist">
          <button class="tab-btn active" data-tab="node"   role="tab" aria-selected="true">Node</button>
          <button class="tab-btn"        data-tab="events" role="tab" aria-selected="false">Events</button>
          <button class="tab-btn"        data-tab="tools"  role="tab" aria-selected="false">Tools</button>
        </div>
      </div>
      <div id="inspector" class="inspector"></div>
    </section>

  </main>
</div>

<div class="busy-overlay" id="busy-overlay" aria-hidden="true">
  <div class="busy-inner">
    <div class="busy-ring"></div>
    <div class="busy-label">Loading…</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
