<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MRI AI STUDIO · Radiology Workstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>

/* ═══════════════════════════════════════════════════════
   MRI_Agent v4  —  Clinical Workstation UI
   Palette: Siemens Healthineers-inspired dark navy + teal
   Font: Source Sans 3 (UI)  +  JetBrains Mono (data)
═══════════════════════════════════════════════════════ */

:root {
  /* ── Background layers ── */
  --bg:          #000000;
  --surface-0:   #060E10;
  --surface-1:   #0B191C;
  --surface-2:   #112226;
  --surface-3:   #172E33;

  /* ── Borders ── */
  --border:      #132028;
  --border-hi:   #1E3540;
  --border-focus:#E8600A;

  /* ── Text ── */
  --text:        #D4E8E4;
  --text-strong: #F8FFFD;
  --text-dim:    #92B8B4;
  --muted:       #5C8482;

  /* ── Siemens teal accent ── */
  --accent:      #E8600A;
  --accent-hi:   #FF7A1A;
  --accent-dim:  rgba(232,96,10,0.13);
  --accent-glow: rgba(232,96,10,0.22);
  --accent-text: #FFAB6A;

  /* ── Siemens Petrol secondary ── */
  --petrol:      #00A0A8;
  --petrol-hi:   #00BFC8;
  --petrol-dim:  rgba(0,160,168,0.12);
  --petrol-text: #5DD8DF;

  /* ── Semantic colors ── */
  --success:     #00C875;
  --success-bg:  rgba(0,200,117,0.09);
  --warning:     #F59E0B;
  --warning-bg:  rgba(245,158,11,0.10);
  --danger:      #EF4444;
  --danger-bg:   rgba(239,68,68,0.10);
  --info:        #00A0A8;
  --info-bg:     rgba(0,160,168,0.10);

  /* ── Node status palette ── */
  --status-planned:   #3A5A58;
  --status-ready:     #E8600A;
  --status-running:   #FF7A1A;
  --status-succeeded: #00C875;
  --status-failed:    #EF4444;
  --status-patched:   #A78BFA;
  --status-blocked:   #F97316;
  --status-skipped:   #6B7280;

  /* ── Shadows ── */
  --shadow-sm:  0 1px 4px rgba(0,0,0,0.35);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.45);
  --shadow-lg:  0 8px 32px rgba(0,0,0,0.55);

  /* ── Geometry ── */
  --radius-xs:  4px;
  --radius-sm:  8px;
  --radius:     12px;
  --radius-lg:  16px;
  --topbar-h:   52px;
  --gap:        10px;

  /* ── Typography ── */
  --font-ui:    'Source Sans 3','Source Sans Pro','Segoe UI',system-ui,sans-serif;
  --font-mono:  'JetBrains Mono','Fira Code',monospace;
}

/* ── Reset ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Shell ───────────────────────────────────────────── */
.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 10px;
  gap: var(--gap);
}

/* ══════════════════════════════════════
   TOP BAR
══════════════════════════════════════ */
.topbar {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  height: var(--topbar-h);
  background: var(--surface-0);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 16px;
}

/* Brand */
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-right: 16px;
  border-right: 1px solid var(--border);
}

.brand-logo {
  width: 28px;
  height: 28px;
  background: var(--accent-dim);
  border: 1px solid rgba(232,96,10,0.3);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand-name {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-strong);
  letter-spacing: 0.04em;
  line-height: 1.1;
}

.brand-sub {
  font-size: 10.5px;
  color: var(--muted);
  line-height: 1;
}

/* Case chips strip */
.topbar-case {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  overflow: hidden;
}

.case-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: #92B8B4;
  white-space: nowrap;
  flex-shrink: 0;
}

.case-chip .chip-label {
  font-size: 9.5px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #6AAEAA;
}

.case-chip .chip-value {
  color: #D4E8E4;
  font-weight: 600;
}

.case-chip.accent {
  background: var(--accent-dim);
  border-color: rgba(232,96,10,0.25);
}

.case-chip.accent .chip-value { color: var(--accent-text); }

/* Progress bar in topbar */
.topbar-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  padding: 0 4px;
}

.progress-track {
  width: 120px;
  height: 4px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.5s ease;
}

.progress-label {
  font-size: 11px;
  font-family: var(--font-mono);
  color: #92B8B4;
  white-space: nowrap;
}

/* Status group */
.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.conn-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text-dim);
}

.conn-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted);
  transition: background 0.3s, box-shadow 0.3s;
}

.conn-badge[data-state="connected"] .conn-dot {
  background: var(--success);
  box-shadow: 0 0 5px var(--success);
}
.conn-badge[data-state="connected"] { color: var(--success); border-color: rgba(0,200,117,0.25); }
.conn-badge[data-state="offline"] .conn-dot { background: var(--warning); }
.conn-badge[data-state="offline"] { color: var(--warning); }

.src-tag {
  padding: 4px 9px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  font-family: var(--font-mono);
  font-size: 10px;
  color: #6AAEAA;
}

/* ══════════════════════════════════════
   WORKSPACE GRID
══════════════════════════════════════ */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: var(--col-left,290px) 4px var(--col-center,1fr) 4px var(--col-right,310px);
  gap: 0;
  min-height: 0;
  padding: 0;
}

/* ── Panel base ─────────────────────── */
.panel {
  background: var(--surface-0);
  border: 1px solid var(--border);
  border-top-color: rgba(0,160,168,0.25);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
/* Small visual gap between panels achieved via margin on children */
.chat-panel   { margin-right: 5px; }
.center-column{ margin: 0 5px; }
.inspector-panel { margin-left: 5px; }
.graph-panel  { margin-bottom: 5px; }

.panel-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface-1) 0%, var(--surface-0) 100%);
}

.panel-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.panel-title h2 {
  font-size: 14px;
  font-weight: 600;
  color: #F0FBF8;
  letter-spacing: -0.01em;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #6AAEAA;
}

/* ══════════════════════════════════════
   CHAT PANEL
══════════════════════════════════════ */
.chat-panel {
  grid-column: 1;
  grid-row: 1;
}

.chat-history {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-hi) transparent;
}

.message {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 100%;
}

.msg-role {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.message.user .msg-role   { color: var(--accent); }
.message.assistant .msg-role { color: var(--muted); }

.msg-bubble {
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid;
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.user .msg-bubble {
  background: var(--accent-dim);
  border-color: rgba(232,96,10,0.22);
  color: var(--accent-text);
}

.message.assistant .msg-bubble {
  background: var(--surface-1);
  border-color: var(--border);
  border-left: 2px solid var(--petrol);
  color: #D4E8E4;
}

/* Chat footer */
.chat-footer {
  flex-shrink: 0;
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--surface-0);
}

.chat-quick-actions {
  display: flex;
  gap: 5px;
}

.qbtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: var(--surface-1);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius-sm);
  font-family: var(--font-ui);
  font-size: 11.5px;
  color: #92B8B4;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.qbtn:hover {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--accent-text);
}

.qbtn svg { flex-shrink: 0; }

textarea {
  font-family: var(--font-ui);
  width: 100%;
  resize: none;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-hi);
  background: var(--surface-1);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

textarea::placeholder { color: var(--muted); }

.chat-send-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

.hint-text {
  font-size: 10.5px;
  color: #5C8482;
}

/* Primary button */
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  background: var(--accent);
  color: #fff;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
}

.btn-primary:hover {
  background: var(--accent-hi);
  box-shadow: 0 0 14px var(--accent-glow);
}

/* ══════════════════════════════════════
   CENTER COLUMN
══════════════════════════════════════ */
.center-column {
  grid-column: 3;
  grid-row: 1;
  display: flex;
  flex-direction: column;
  gap: 0;
  min-height: 0;
  overflow: hidden;
}

/* ── Graph Panel ────────────────────── */
.graph-panel {
  flex: none;
  height: var(--row-graph, 58%);
  min-height: 120px;
  min-width: 0;
}

.panel-header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Small control buttons */
.cbtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  background: var(--surface-1);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius-sm);
  font-family: var(--font-ui);
  font-size: 12px;
  color: #92B8B4;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.cbtn:hover { background: var(--surface-2); color: #D4E8E4; border-color: #92B8B4; }
.cbtn.cbtn-accent {
  background: var(--accent-dim);
  border-color: rgba(0,168,204,0.3);
  color: var(--accent-text);
}
.cbtn.cbtn-accent:hover {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 10px var(--accent-glow);
  border-color: var(--accent);
}
.cbtn.cbtn-danger:hover {
  background: var(--danger-bg);
  border-color: var(--danger);
  color: var(--danger);
}

.cbtn-divider {
  width: 1px;
  height: 18px;
  background: var(--border);
  flex-shrink: 0;
}

/* Graph meta pills */
.graph-meta {
  display: flex;
  gap: 5px;
  align-items: center;
}

.graph-meta-pill {
  padding: 2px 8px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: #92B8B4;
}

.graph-canvas {
  flex: 1;
  overflow: auto;
  min-height: 0;
  position: relative;
  background-color: #030808;
  background-image:
    linear-gradient(rgba(0,100,110,0.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,100,110,0.18) 1px, transparent 1px);
  background-size: 20px 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-hi) transparent;
}

/* ── Graph Nodes ────────────────────── */
.graph-stage {
  position: relative;
}

.graph-edges {
  position: absolute;
  inset: 0;
  overflow: visible;
  pointer-events: none;
}

.g-edge {
  fill: none;
  stroke: var(--border-hi);
  stroke-width: 1.5;
}
.g-edge.type-data     { stroke: rgba(0,160,168,0.4); stroke-dasharray: 4 3; }
.g-edge.type-approval { stroke: rgba(0,200,117,0.35); }
.g-edge.type-feedback { stroke: rgba(245,158,11,0.35); }

.graph-node {
  position: absolute;
  width: 172px;
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius);
  cursor: pointer;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  user-select: none;
}

.graph-node:hover {
  border-color: var(--text-dim);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.graph-node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(232,96,10,0.18), 0 0 20px rgba(232,96,10,0.10), var(--shadow-md);
}

.graph-node.status-running {
  border-color: var(--warning);
  animation: pulse-warning 2s ease-in-out infinite;
}

.graph-node.status-succeeded { border-color: rgba(0,200,117,0.45); }
.graph-node.status-failed    { border-color: rgba(239,68,68,0.45); }

@keyframes pulse-warning {
  0%,100% { box-shadow: 0 0 0 1px rgba(245,158,11,0.2); }
  50%     { box-shadow: 0 0 0 3px rgba(245,158,11,0.25), 0 0 18px rgba(245,158,11,0.1); }
}

/* Color bar at top of node */
.node-bar {
  height: 2px;
  flex-shrink: 0;
}
.node-bar.status-planned   { background: var(--status-planned);   opacity: 0.6; }
.node-bar.status-ready     { background: var(--status-ready); }
.node-bar.status-running   { background: var(--status-running); }
.node-bar.status-succeeded { background: var(--status-succeeded); }
.node-bar.status-failed    { background: var(--status-failed); }
.node-bar.status-patched   { background: var(--status-patched); }
.node-bar.status-blocked   { background: var(--status-blocked); }
.node-bar.status-skipped   { background: var(--status-skipped); }

.node-content {
  padding: 12px 13px 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.node-top-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
}

.node-kind {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 2px 6px;
  border-radius: 3px;
  flex-shrink: 0;
}

.node-title {
  font-size: 12.5px;
  font-weight: 600;
  color: #F8FFFD;
  line-height: 1.3;
}

.node-tool-name {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #7AACAA;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.node-footer {
  padding: 7px 13px 9px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.node-owner {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: #6A9A98;
}

/* ── Status pills ───────────────────── */
.spill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.spill::before {
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: currentColor;
}
.spill.succeeded  { background: var(--success-bg);  color: var(--success); }
.spill.running    { background: var(--warning-bg);  color: var(--warning); }
.spill.failed     { background: var(--danger-bg);   color: var(--danger); }
.spill.planned    { background: rgba(69,96,128,0.15); color: var(--status-planned); }
.spill.ready      { background: var(--accent-dim);  color: var(--accent-text); }
.spill.patched    { background: rgba(167,139,250,0.12); color: var(--status-patched); }
.spill.blocked    { background: var(--warning-bg);  color: var(--warning); opacity: 0.7; }
.spill.skipped    { background: rgba(107,114,128,0.12); color: var(--status-skipped); }

/* ── Viewer Panel ───────────────────── */
.viewer-panel {
  flex: 1;
  min-height: 80px;
  min-width: 0;
}

.viewer-body {
  display: grid;
  grid-template-columns: 1fr 200px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.artifact-preview {
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-right: 1px solid var(--border);
  scrollbar-width: thin;
  scrollbar-color: var(--border-hi) transparent;
}

.artifact-rail {
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-hi) transparent;
}

.rail-section-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #6AAEAA;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.artifact-list { display: flex; flex-direction: column; gap: 5px; }

.art-item {
  padding: 9px 11px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: all 0.12s;
  text-align: left;
  color: var(--text);
  font-family: var(--font-ui);
  width: 100%;
}

.art-item:hover   { background: var(--surface-2); border-color: var(--border-hi); }
.art-item.selected { border-color: var(--accent); background: var(--accent-dim); }

.art-name {
  font-size: 12px;
  font-weight: 600;
  color: #F0FBF8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.art-uri {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Artifact preview content */
.prev-head {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.prev-head h3 {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-strong);
}

.prev-path {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  word-break: break-all;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  background: var(--surface-2);
  border: 1px solid var(--border-hi);
  border-radius: 4px;
  font-size: 10px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

.meta-row {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 5px;
}

.meta-cell {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
}

.meta-cell .mc-label { font-size: 9.5px; color: var(--muted); margin-bottom: 2px; }
.meta-cell .mc-val { font-size: 11.5px; font-weight: 600; color: var(--text-strong); }

.prev-stage {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  overflow: auto;
}

.prev-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
}

.prev-item {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
}
.prev-item .pi-key { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
.prev-item .pi-val { font-size: 12px; color: var(--text-strong); font-weight: 500; }

.prev-text-chips { display: flex; flex-wrap: wrap; gap: 5px; }

details.prev-details {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

details.prev-details summary {
  padding: 8px 11px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}

details.prev-details summary::before {
  content: '▶';
  font-size: 8px;
  color: var(--muted);
  transition: transform 0.15s;
  flex-shrink: 0;
}

details.prev-details[open] summary::before { transform: rotate(90deg); }
details.prev-details .code { border-top: 1px solid var(--border); }

.artifact-svg, .artifact-image {
  display: block;
  width: 100%;
  height: auto;
  border-radius: var(--radius-xs);
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 28px 20px;
  text-align: center;
  border: 1px dashed var(--border-hi);
  border-radius: var(--radius-sm);
  min-height: 100px;
}

.empty-state p { font-size: 12.5px; color: var(--muted); }
.empty-state svg { color: var(--border-hi); margin-bottom: 2px; }

.prev-link {
  font-size: 11.5px;
  color: var(--accent-text);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.prev-link:hover { text-decoration: underline; }

/* ══════════════════════════════════════
   INSPECTOR PANEL
══════════════════════════════════════ */
.inspector-panel {
  grid-column: 5;
  grid-row: 1;
}

.insp-header {
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  padding-bottom: 0;
  border-bottom: none;
}

.insp-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 0;
}

.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 0;
}

.tab-btn {
  padding: 8px 13px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: var(--font-ui);
  font-size: 12.5px;
  font-weight: 500;
  color: #7AACAA;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: -1px;
}

.tab-btn:hover { color: #D4E8E4; }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.inspector {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-hi) transparent;
}

/* Inspector sections */
.insp-section {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.sec-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #6AAEAA;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}

/* KV grid */
.kv {
  display: grid;
  grid-template-columns: 82px 1fr;
  gap: 5px 8px;
  font-size: 12.5px;
}

.kv-k {
  color: #7AACAA;
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding-top: 1px;
}

.kv-v { color: #D4E8E4; word-break: break-word; }
.kv-v.mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }

/* Event cards */
.event-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: border-color 0.12s;
}

.event-card:hover { border-color: var(--border-hi); }
.event-card.active { border-color: var(--petrol); background: var(--petrol-dim); }

.ev-type  { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--accent-text); }
.ev-actor { font-size: 11px; color: #92B8B4; }
.ev-time  { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); }

/* Tool / capability cards */
.tool-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.tool-card strong { font-size: 12.5px; color: var(--text-strong); }
.tool-card p      { font-size: 11.5px; color: #92B8B4; }

/* Artifact / proposal cards in inspector */
.insp-art-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
  transition: all 0.12s;
  text-align: left;
  font-family: var(--font-ui);
  width: 100%;
  color: var(--text);
}

.insp-art-card:hover   { background: var(--surface-2); border-color: var(--border-hi); }
.insp-art-card.selected { border-color: var(--accent); background: var(--accent-dim); }

.proposal-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* Code block */
.code {
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: pre-wrap;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  color: var(--text-dim);
  overflow-x: auto;
  line-height: 1.6;
}

.prev-lines {
  max-height: 260px;
  overflow: auto;
  scrollbar-width: thin;
}

/* Flex helpers */
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* ══════════════════════════════════════
   PIPELINE STEP INDICATOR
══════════════════════════════════════ */
.pipeline-strip {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 16px 10px;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.pipeline-strip::-webkit-scrollbar { display: none; }

.pip-step {
  display: flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
}

.pip-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border-hi);
  background: var(--surface-1);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  position: relative;
}

.pip-dot:hover { border-color: var(--text-dim); }
.pip-dot.selected { border-color: var(--accent); background: var(--accent-dim); }
.pip-dot.succeeded { border-color: var(--success); background: var(--success-bg); }
.pip-dot.running   { border-color: var(--warning); background: var(--warning-bg); animation: pulse-warning 1.5s ease-in-out infinite; }
.pip-dot.failed    { border-color: var(--danger); background: var(--danger-bg); }

.pip-dot-inner {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border-hi);
  transition: background 0.15s;
}
.pip-dot.selected .pip-dot-inner   { background: var(--accent); }
.pip-dot.succeeded .pip-dot-inner  { background: var(--success); }
.pip-dot.running .pip-dot-inner    { background: var(--warning); }
.pip-dot.failed .pip-dot-inner     { background: var(--danger); }

.pip-line {
  flex: 1;
  min-width: 20px;
  max-width: 48px;
  height: 2px;
  background: var(--border);
  transition: background 0.3s;
}

.pip-line.done { background: var(--success); opacity: 0.5; }

.pip-label {
  position: absolute;
  top: 26px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 9px;
  color: var(--muted);
  pointer-events: none;
}

/* ══════════════════════════════════════
   BUSY OVERLAY
══════════════════════════════════════ */
.busy-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7,17,31,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 9999;
  backdrop-filter: blur(1px);
}

.busy-overlay.active { opacity: 1; pointer-events: auto; }

.busy-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.busy-ring {
  width: 28px; height: 28px;
  border: 2px solid var(--border-hi);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
}

.busy-label {
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════
   SCROLLBARS
══════════════════════════════════════ */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1E3540; border-radius: 4px; }

/* ══════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════ */
@media (max-width: 1280px) {
  .workspace { grid-template-columns: var(--col-left,270px) 4px var(--col-center,1fr) 4px var(--col-right,290px); }
}

@media (max-width: 1060px) {
  body { overflow: auto; }
  .shell { height: auto; overflow: visible; }
  .workspace {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
  .chat-panel    { height: 400px; }
  .graph-panel   { height: 280px; }
  .viewer-panel  { height: 260px; }
  .inspector-panel { height: 380px; }
  .inspector-panel { grid-column: 1; }
}

@media (max-width: 640px) {
  .shell { padding: 6px; gap: 6px; }
  .topbar { grid-template-columns: auto 1fr; }
  .topbar-case { display: none; }
  .pipeline-strip { display: none; }
}

  
/* ══════════════════════════════════════
   RESIZE HANDLES
══════════════════════════════════════ */
#resize-col-left  { grid-column: 2; grid-row: 1; }
#resize-col-right { grid-column: 4; grid-row: 1; }

.resize-col {
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: col-resize;
  z-index: 10;
  user-select: none;
  touch-action: none;
  position: relative;
}

.resize-col::before {
  content: '';
  width: 2px;
  height: 40px;
  background: var(--border-hi);
  border-radius: 2px;
  transition: background 0.2s, height 0.2s;
}

.resize-col:hover::before,
.resize-col.dragging::before {
  background: var(--accent);
  height: 60px;
  box-shadow: 0 0 8px var(--accent-glow);
}

/* 3 dot grip indicator */
.resize-col::after {
  content: '⋮';
  position: absolute;
  color: var(--border-hi);
  font-size: 14px;
  line-height: 1;
  transition: color 0.2s;
  pointer-events: none;
}
.resize-col:hover::after,
.resize-col.dragging::after {
  color: var(--accent);
}

.resize-row {
  height: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: row-resize;
  z-index: 10;
  user-select: none;
  touch-action: none;
  position: relative;
  flex-shrink: 0;
}

.resize-row::before {
  content: '';
  height: 2px;
  width: 40px;
  background: var(--border-hi);
  border-radius: 2px;
  transition: background 0.2s, width 0.2s;
}

.resize-row:hover::before,
.resize-row.dragging::before {
  background: var(--accent);
  width: 60px;
  box-shadow: 0 0 8px var(--accent-glow);
}

.resize-row::after {
  content: '···';
  position: absolute;
  color: var(--border-hi);
  font-size: 10px;
  letter-spacing: 2px;
  transition: color 0.2s;
  pointer-events: none;
}
.resize-row:hover::after,
.resize-row.dragging::after {
  color: var(--accent);
}

/* Prevent text selection during drag */
body.resizing * {
  user-select: none !important;
  cursor: col-resize !important;
}
body.resizing-row * {
  user-select: none !important;
  cursor: row-resize !important;
}

/* ══════════════════════════════════════
   ERROR / REFLECTOR STATES
══════════════════════════════════════ */

/* ── Failed node — pulsing red ── */
.graph-node.status-failed {
  border-color: rgba(239,68,68,0.6);
  animation: pulse-error 2s ease-in-out infinite;
}
@keyframes pulse-error {
  0%,100% { box-shadow: 0 0 0 1px rgba(239,68,68,0.15); }
  50%      { box-shadow: 0 0 0 4px rgba(239,68,68,0.22), 0 0 24px rgba(239,68,68,0.10); }
}

/* ── Reflecting node — orange breathing glow (brain thinking) ── */
.graph-node.status-reflecting {
  border-color: rgba(232,96,10,0.7);
  animation: pulse-reflecting 1.4s ease-in-out infinite;
}
@keyframes pulse-reflecting {
  0%,100% { box-shadow: 0 0 0 1px rgba(232,96,10,0.15); }
  50%      { box-shadow: 0 0 0 5px rgba(232,96,10,0.28), 0 0 28px rgba(232,96,10,0.12); }
}
.node-bar.status-reflecting { background: var(--accent); animation: bar-blink 1.4s ease-in-out infinite; }
@keyframes bar-blink { 0%,100%{opacity:0.6} 50%{opacity:1} }

/* ── Retrying node — same as running but teal (petrol) ── */
.graph-node.status-retrying { border-color: var(--petrol); animation: pulse-retry 1.6s ease-in-out infinite; }
@keyframes pulse-retry {
  0%,100% { box-shadow: 0 0 0 1px rgba(0,160,168,0.15); }
  50%      { box-shadow: 0 0 0 4px rgba(0,160,168,0.25), 0 0 22px rgba(0,160,168,0.10); }
}
.node-bar.status-retrying { background: var(--petrol); }

.spill.reflecting { background: rgba(232,96,10,0.15); color: #FF7A1A; }
.spill.retrying   { background: var(--petrol-dim);    color: var(--petrol-text); }

.pip-dot.failed    { border-color: var(--danger);  background: rgba(239,68,68,0.10); }
.pip-dot.reflecting{ border-color: var(--accent);  background: rgba(232,96,10,0.12); animation: pulse-reflecting 1.4s ease-in-out infinite; }
.pip-dot.retrying  { border-color: var(--petrol);  background: var(--petrol-dim); animation: pulse-retry 1.6s ease-in-out infinite; }

.pip-dot.failed    .pip-dot-inner { background: var(--danger); }
.pip-dot.reflecting .pip-dot-inner{ background: var(--accent); }
.pip-dot.retrying  .pip-dot-inner { background: var(--petrol); }

/* ── Error badge on node card ── */
.node-error-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: rgba(239,68,68,0.10);
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: 6px;
  font-size: 10.5px;
  color: #FF8080;
  font-family: var(--font-mono);
  line-height: 1.35;
  word-break: break-word;
}

.node-retry-count {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--muted);
  padding: 1px 5px;
  background: var(--surface-2);
  border-radius: 4px;
}

/* ── Reflector banner (in graph panel header area) ── */
.reflector-banner {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  background: linear-gradient(90deg, rgba(232,96,10,0.10) 0%, rgba(0,160,168,0.06) 100%);
  border-bottom: 1px solid rgba(232,96,10,0.22);
  animation: banner-in 0.3s ease;
}
@keyframes banner-in { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

.reflector-banner.hidden { display: none; }

.reflector-spinner {
  width: 14px; height: 14px;
  border: 1.5px solid rgba(232,96,10,0.3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

.reflector-banner-text {
  flex: 1;
  min-width: 0;
}
.reflector-banner-title {
  font-size: 12px;
  font-weight: 600;
  color: #FFAB6A;
}
.reflector-banner-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.reflector-banner-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.banner-btn {
  padding: 4px 10px;
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 500;
  border: 1px solid;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.banner-btn.accept {
  background: var(--accent-dim);
  border-color: rgba(232,96,10,0.35);
  color: #FFAB6A;
}
.banner-btn.accept:hover { background: var(--accent); color: #fff; }
.banner-btn.dismiss {
  background: transparent;
  border-color: var(--border-hi);
  color: var(--text-dim);
}
.banner-btn.dismiss:hover { border-color: var(--text-dim); color: var(--text); }

/* ── Inspector error section ── */
.error-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  background: rgba(239,68,68,0.06);
  border: 1px solid rgba(239,68,68,0.22);
  border-radius: var(--radius-sm);
}

.error-block-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: #FF8080;
}

.error-block-msg {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: #FFB0B0;
  line-height: 1.5;
  white-space: pre-wrap;
}

.reflector-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  background: rgba(232,96,10,0.07);
  border: 1px solid rgba(232,96,10,0.20);
  border-radius: var(--radius-sm);
}

.reflector-block-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: #FFAB6A;
}

.reflector-block-msg {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.55;
}

.retry-history {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.retry-entry {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  padding: 5px 8px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 6px;
}

// ── Layout constants ─────────────────────────────
const NODE_W  = 172;
const NODE_H  = 104;
const GAP_X   = 220;
const PAD     = 28;

// ── Utilities ────────────────────────────────────
function clone(v) { return JSON.parse(JSON.stringify(v)); }

function escapeHtml(v) {
  return String(v ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
}

function escapeAttr(v) { return escapeHtml(v).replaceAll("`","&#96;"); }

function prettyJson(v) {
  if (v === null || v === undefined || v === "") return "null";
  try { return JSON.stringify(v, null, 2); } catch { return String(v); }
}

function truncate(v, n = 100) {
  const s = String(v ?? "");
  return s.length <= n ? s : s.slice(0, n-1).trimEnd() + "…";
}

function scalarPreview(v) {
  if (v === null)      return "null";
  if (v === undefined) return "undefined";
  if (Array.isArray(v)) { const h = v.slice(0,3).map(scalarPreview).join(", "); return v.length > 3 ? `[${h}, …] (${v.length})` : `[${h}]`; }

}

  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.text();
}

function unwrap(p, key) {
  if (!p || typeof p !== "object") return null;
  if (key && Object.prototype.hasOwnProperty.call(p, key)) return p[key];
  return p;
}
const normalizeSessionPayload = p => { const s = unwrap(p,"session"); return s && typeof s==="object" ? s : null; };
const normalizeGraphPayload   = p => { const g = unwrap(p,"graph");   return g && typeof g==="object" ? g : null; };

  const e = unwrap(p,"events");

function normalizeJsonPayload(p) {
  if (p == null) return null;
  if (typeof p === "string") { try { return JSON.parse(p); } catch { return p; } }

}

// ── Layout ───────────────────────────────────────
function defaultNodeLayout(i) { return { x: PAD + i * GAP_X, y: PAD }; }

function ensureNodeLayouts(graph) {
  if (!graph?.nodes) return;
  const next = {};
  graph.nodes.forEach((n, i) => {
    const e = state.nodeLayouts?.[n.node_id];
    next[n.node_id] = (e && isFinite(e.x) && isFinite(e.y)) ? e : defaultNodeLayout(i);
  });

}

function graphMetrics(graph) {
  const pos = (graph?.nodes || []).map((n,i) => state.nodeLayouts?.[n.node_id] || defaultNodeLayout(i));
  return {
    width:  Math.max(700, pos.length ? Math.max(...pos.map(p=>p.x)) + NODE_W + PAD : PAD),
    height: Math.max(200, pos.length ? Math.max(...pos.map(p=>p.y)) + NODE_H + PAD + 40 : PAD),

}

function portRight(nodeId) { const l = state.nodeLayouts?.[nodeId] || defaultNodeLayout(0); return { x: l.x + NODE_W, y: l.y + NODE_H/2 }; }

  if (txt && (txt.startsWith("data:image/svg+xml") || txt.includes("<svg"))) return "svg";
  if (kind==="svg" || mime.includes("image/svg") || uri.endsWith(".svg")) return "svg";
  if (kind==="json" || mime.includes("json") || uri.endsWith(".json") || pt==="object" || pt==="array") return "json";
  if (kind==="text"||kind==="report"||kind==="log"||mime.startsWith("text/")||[".txt",".md",".log",".csv"].some(e=>uri.endsWith(e))) return "text";

  const valid = new Set((state.graph?.artifacts||[]).map(a=>a.artifact_id));
  state.artifactPayloads = Object.fromEntries(Object.entries(state.artifactPayloads||{}).filter(([id])=>valid.has(id)));
  state.artifactLoading  = Object.fromEntries(Object.entries(state.artifactLoading ||{}).filter(([id])=>valid.has(id)));
}

function selectFirstArtifactForNode(nodeId) {
  const v = collectArtifacts(nodeId).filter(a=>a.visible!==false);
  if (v.length) return v[0].artifact_id;
  return (state.graph.artifacts||[]).find(a=>a.visible!==false)?.artifact_id || null;
}

function syncArtifactSelection() {
  const node = nodeById(state.selectedNodeId) || state.graph.nodes[0] || null;
  const preferred = node ? selectFirstArtifactForNode(node.node_id) : null;
  const nodeArts = node ? collectArtifacts(node.node_id).filter(a=>a.visible!==false) : [];
  const sessionSel = state.session?.case_state?.selected_artifacts || [];
  const match = sessionSel.find(id=>nodeArts.some(a=>a.artifact_id===id));
  const avail = new Set((state.graph.artifacts||[]).filter(a=>a.visible!==false).map(a=>a.artifact_id));
  const next = match || (preferred && avail.has(preferred) ? preferred : null) || null;
  if (next !== state.selectedArtifactId) state.selectedArtifactId = next;
  if (state.selectedArtifactId && !avail.has(state.selectedArtifactId)) state.selectedArtifactId = null;
}

function selectArtifact(id) {
  state.selectedArtifactId = id;
  const a = artifactById(id);
  if (a) {
    state.session.case_state.selected_artifacts = [id];
    state.session.case_state.ui_focus = {...(state.session.case_state.ui_focus||{}), panel:"viewer", selected_artifact:id};
    void ensureArtifactPayloadLoaded(a);
  }
}

async function ensureArtifactPayloadLoaded(a) {
  if (!a?.artifact_id || extractInline(a)!==null) return;
  if (Object.prototype.hasOwnProperty.call(state.artifactPayloads, a.artifact_id) || state.artifactLoading?.[a.artifact_id]) return;
  const fmt = inferFormat(a, null);
  if (!["json","text","svg"].includes(fmt)) return;
  const url = artifactPublicUrl(a);
  if (!url) return;
  state.artifactLoading = {...(state.artifactLoading||{}), [a.artifact_id]: true};
  try {
    const text = await fetchText(url);
    state.artifactPayloads = {...(state.artifactPayloads||{}), [a.artifact_id]: fmt==="json" ? normalizeJsonPayload(text) : text};
  } catch(err) {
    console.error(err);
    state.artifactPayloads = {...(state.artifactPayloads||{}), [a.artifact_id]: null};
  } finally {
    const nxt = {...(state.artifactLoading||{})};
    delete nxt[a.artifact_id];
    state.artifactLoading = nxt;
    renderAll();
  }
}

// ── Snapshot ──────────────────────────────────────
function applySnapshot(snap, source) {
  const session = normalizeSessionPayload(snap.session || snap);
  const graph   = normalizeGraphPayload(snap.graph || snap?.graph || session?.graph);
  const events  = normalizeEventsPayload(snap.events || graph?.events || session?.graph?.events);
  state.connected = source === "api";
  state.source    = source;
  state.session   = clone(session || fallbackSnapshot.session);
  state.graph     = ensureGraphDefaults(clone(graph || fallbackSnapshot.graph));
  ensureNodeLayouts(state.graph);
  state.events    = clone(events || []);
  if (!state.selectedNodeId || !state.graph.nodes.some(n=>n.node_id===state.selectedNodeId)) {
    state.selectedNodeId = state.graph.nodes[0]?.node_id || null;
  }
  state.session.graph        = state.graph;
  state.session.chat_history = state.session.chat_history || [];
  state.session.tool_catalog = state.toolCatalog;
  state.session.capabilities = state.capabilitySummary?.capabilities || [];
  pruneArtifactCaches();
  syncArtifactSelection();
}

// ── Graph canvas ──────────────────────────────────
function renderGraph() {
  const canvas = document.getElementById("graph-canvas");
  if (!canvas) return;
  const graph = state.graph;
  const m = graphMetrics(graph);

  const nodesHtml = (graph.nodes||[]).map((n, i) => {
    const l   = state.nodeLayouts?.[n.node_id] || defaultNodeLayout(i);
    const sel = n.node_id === state.selectedNodeId;
    const st  = n.status || "planned";
    const tool = n.tool_name || n.action_type || "";
    return `
      <div class="graph-node status-${escapeHtml(st)}${sel?" selected":""}"
        data-node-id="${escapeAttr(n.node_id)}"
        style="left:${l.x}px;top:${l.y}px;width:${NODE_W}px"
        role="button" tabindex="0" aria-label="${escapeAttr(n.title)} — ${escapeAttr(st)}">
        <div class="node-bar status-${escapeHtml(st)}"></div>
        <div class="node-content">
          <div class="node-top-row">
            <span class="node-kind">${escapeHtml(n.kind)}</span>
            <span class="spill ${escapeHtml(st)}">${escapeHtml(st)}</span>
          </div>
          <div class="node-title">${escapeHtml(n.title)}</div>
          ${tool ? `<div class="node-tool-name">${escapeHtml(tool)}</div>` : ""}
        </div>
        <div class="node-footer">
          <span class="node-owner">${escapeHtml(n.owner||"")}</span>
          ${n.editable ? `<span class="chip" style="font-size:8.5px;padding:1px 5px">editable</span>` : ""}
        </div>
      </div>
    `;
  }).join("");

  const edgesHtml = (graph.edges||[]).map(e => {
    const from = portRight(e.from_node);
    const to   = portLeft(e.to_node);
    const dx   = Math.abs(to.x - from.x) * 0.45;
    const d    = `M${from.x},${from.y} C${from.x+dx},${from.y} ${to.x-dx},${to.y} ${to.x},${to.y}`;
    return `<path class="g-edge type-${escapeHtml(e.type||"control")}" data-edge-id="${escapeAttr(e.edge_id)}" d="${d}" marker-end="url(#arr)"/>`;
  }).join("");

  canvas.innerHTML = `
    <div class="graph-stage" style="width:${m.width}px;height:${m.height}px;position:relative;">
      <svg class="graph-edges" width="${m.width}" height="${m.height}" style="position:absolute;inset:0;overflow:visible;pointer-events:none;">
        <defs>
          <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,7 L7,3.5 z" fill="rgba(37,66,104,0.9)"/>
          </marker>
        </defs>
        ${edgesHtml}
      </svg>
      ${nodesHtml}
    </div>
  `;

  // Graph meta
  const meta = document.getElementById("graph-meta");
  if (meta) {
    const st  = graph.status || "—";
    const done = (graph.nodes||[]).filter(n=>n.status==="succeeded").length;
    meta.innerHTML = `
      <span class="graph-meta-pill">${escapeHtml(st)}</span>
      <span class="graph-meta-pill">v${escapeHtml(String(graph.version||1))}</span>
      <span class="graph-meta-pill">${done}/${(graph.nodes||[]).length} done</span>
    `;
  }

  // Interactions
  canvas.querySelectorAll(".graph-node").forEach(el => {
    const nodeId = el.dataset.nodeId;
    el.addEventListener("click", e => { if (!e.defaultPrevented) { state.selectedNodeId = nodeId; renderAll(); } });
    el.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") { e.preventDefault(); state.selectedNodeId=nodeId; renderAll(); } });
    attachDrag(nodeId, el);
  });

  renderPipelineStrip();
}

function updateGraphGeometry() {
  const canvas = document.getElementById("graph-canvas");
  const stage  = canvas?.querySelector(".graph-stage");
  if (!canvas || !stage) return;
  const m = graphMetrics(state.graph);
  stage.style.width  = `${m.width}px`;
  stage.style.height = `${m.height}px`;
  const svg = stage.querySelector(".graph-edges");
  if (svg) { svg.setAttribute("width",String(m.width)); svg.setAttribute("height",String(m.height)); }
  (state.graph.nodes||[]).forEach((n,i) => {
    const el = stage.querySelector(`[data-node-id="${CSS.escape(n.node_id)}"]`);
    const l  = state.nodeLayouts?.[n.node_id] || defaultNodeLayout(i);
    if (el) { el.style.left=`${l.x}px`; el.style.top=`${l.y}px`; }
  });
  (state.graph.edges||[]).forEach(e => {
    const path = stage.querySelector(`[data-edge-id="${CSS.escape(e.edge_id)}"]`);
    if (!path) return;
    const from = portRight(e.from_node), to = portLeft(e.to_node);
    const dx = Math.abs(to.x-from.x)*0.45;
    path.setAttribute("d",`M${from.x},${from.y} C${from.x+dx},${from.y} ${to.x-dx},${to.y} ${to.x},${to.y}`);
  });
}

function attachDrag(nodeId, handle) {
  handle.addEventListener("pointerdown", ev => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const origin = state.nodeLayouts?.[nodeId] || defaultNodeLayout(0);
    const sx = ev.clientX, sy = ev.clientY;
    let moved = false;
    const onMove = e => {
      moved = true;
      state.nodeLayouts = {...(state.nodeLayouts||{}), [nodeId]: {x:Math.max(8,origin.x+(e.clientX-sx)), y:Math.max(8,origin.y+(e.clientY-sy))}};
      updateGraphGeometry();
    };
    const onUp = e => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (moved) e.preventDefault();
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp, {once:true});
  });
}

      <div class="empty-state" style="flex:1;min-height:120px">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="4" y="4" width="20" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="10" x2="20" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="14" x2="16" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="18" x2="12" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <p>Select a node, then choose an artifact to preview.</p>
      </div>
    `;
    return;
  }
  el.innerHTML = buildPreviewHtml(a);

function buildPreviewHtml(a) {
  const payload = extractPayload(a);
  const fmt     = inferFormat(a, payload);
  const norm    = normalizeJsonPayload(payload);
  const disp    = norm !== null ? norm : payload;
  const loading = Boolean(state.artifactLoading?.[a.artifact_id]);
  const pubUrl  = artifactPublicUrl(a);

  const chips = [a.kind, a.role, a.mime_type].filter(Boolean).map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join("");
  const header = `
    <div class="prev-head">
      <div class="row">
        <div>
          <div class="eyebrow" style="margin-bottom:3px">Artifact</div>
          <h3>${escapeHtml(a.name||a.artifact_id)}</h3>
          <div class="prev-path">${escapeHtml(a.uri||"no uri")}</div>
        </div>
        ${pubUrl ? `<a class="prev-link" href="${escapeAttr(pubUrl)}" target="_blank" rel="noreferrer" title="Open raw">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5 2H2v8h8V7M7 1h4v4M5 7l5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Raw
        </a>` : ""}
      </div>
      ${chips ? `<div class="chip-row">${chips}</div>` : ""}
      <div class="meta-row">
        <div class="meta-cell"><div class="mc-label">ID</div><div class="mc-val" style="font-family:var(--font-mono);font-size:9.5px;word-break:break-all">${escapeHtml(a.artifact_id)}</div></div>
        <div class="meta-cell"><div class="mc-label">Node</div><div class="mc-val">${escapeHtml(a.node_id)}</div></div>
        <div class="meta-cell"><div class="mc-label">Format</div><div class="mc-val">${escapeHtml(fmt)}</div></div>
      </div>
    </div>
  `;

  if (fmt === "svg") {
    const svg = typeof disp==="string" ? disp : disp?.svg || disp?.markup || "";
    const src = svg ? (svg.startsWith("data:")? svg : svgToDataUri(svg)) : pubUrl;
    return `${header}
      <div class="prev-stage">${src ? `<img class="artifact-svg" src="${src}" alt="${escapeAttr(a.name)}"/>` : loading ? `<p style="color:var(--muted);font-size:12px">Loading…</p>` : `<p style="color:var(--muted);font-size:12px">SVG unavailable.</p>`}</div>
      ${svg ? `<details class="prev-details"><summary>SVG source</summary><div class="code">${escapeHtml(svg)}</div></details>` : ""}`;
  }

  if (fmt === "json") {
    return `${header}
      ${loading && !disp ? `<p style="color:var(--muted);font-size:12px">Loading…</p>` : ""}
      ${buildPrevGrid(norm && typeof norm==="object" ? norm : {})}
      <details class="prev-details" open><summary>JSON payload</summary><div class="code">${escapeHtml(prettyJson(disp))}</div></details>`;
  }

  if (fmt === "text") {
    const txt = typeof disp==="string" ? disp : prettyJson(disp);
    const lines = txt.split(/\r?\n/);
    return `${header}
      <div class="prev-text-chips chip-row">
        <span class="chip">${lines.length} lines</span>
        <span class="chip">${escapeHtml(truncate(txt.replace(/\s+/g," "),60))}</span>
      </div>
      <pre class="code prev-lines">${escapeHtml(lines.slice(0,30).map((l,i)=>`${String(i+1).padStart(2,"0")}  ${l}`).join("\n"))}${lines.length>30?"\n…":"" }</pre>`;
  }

  if (fmt === "image") {
    const src = typeof disp==="string" ? disp : disp?.uri||disp?.src||pubUrl;
    return `${header}<div class="prev-stage">${src ? `<img class="artifact-image" src="${escapeAttr(src)}" alt="${escapeAttr(a.name)}"/>` : `<p style="color:var(--muted);font-size:12px">Image unavailable.</p>`}</div>`;
  }

  const meta = a.metadata || {};
  return `${header}
    ${Object.keys(meta).length ? buildPrevGrid(meta) : `<p style="color:var(--muted);font-size:12px;margin:4px 0">No preview data.</p>`}
    <details class="prev-details" open><summary>Metadata</summary><div class="code">${escapeHtml(prettyJson(meta))}</div></details>`;
}

function buildPrevGrid(val, limit=6) {
  if (!val || typeof val !== "object") return "";
  const entries = Array.isArray(val) ? val.slice(0,limit).map((v,i)=>[String(i),v]) : Object.entries(val).slice(0,limit);
  if (!entries.length) return `<p style="color:var(--muted);font-size:12px">Empty.</p>`;
  return `<div class="prev-grid">${entries.map(([k,v])=>`<div class="prev-item"><div class="pi-key">${escapeHtml(k)}</div><div class="pi-val">${escapeHtml(scalarPreview(v))}</div></div>`).join("")}</div>`;
}

// ── Inspector ─────────────────────────────────────
function renderInspector() {
  const el = document.getElementById("inspector");
  if (!el) return;
  switch (state.inspectorTab) {
    case "node":   el.innerHTML = buildNodeTab();   break;
    case "events": el.innerHTML = buildEventsTab(); break;
    case "tools":  el.innerHTML = buildToolsTab();  break;
    default:       el.innerHTML = buildNodeTab();
  }
  el.querySelectorAll("[data-artifact-id]").forEach(btn => {
    btn.addEventListener("click", () => { selectArtifact(btn.dataset.artifactId); renderAll(); });

function collectRelatedEvents(nodeId) {
  return (state.events||[]).filter(e=>e.target_id===nodeId||e.payload?.node_id===nodeId||e.payload?.selected_node===nodeId);
}

function buildNodeTab() {
  const node = nodeById(state.selectedNodeId);
  if (!node) return `<div class="empty-state"><p>Click any node on the pipeline to inspect it.</p></div>`;

  const arts  = collectArtifacts(node.node_id);
  const evts  = collectRelatedEvents(node.node_id);
  const props = state.graph.proposals || [];

  // ── Error + Reflector section (top priority when failed) ──
  const isFailed     = node.status === "failed" || node.status === "reflecting" || node.status === "retrying";
  const retryHistory = node.retry_history || [];
  const rs = state.reflectorState;

  const errorSection = isFailed && node.last_error ? `
    <div class="insp-section">
      <div class="sec-label">⚠ Error Details</div>
      <div class="error-block">
        <div class="error-block-title">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="#FF8080" stroke-width="1.2"/><line x1="6" y1="3.5" x2="6" y2="6.5" stroke="#FF8080" stroke-width="1.2" stroke-linecap="round"/><circle cx="6" cy="8.5" r="0.6" fill="#FF8080"/></svg>
          Runtime Error
        </div>
        <div class="error-block-msg">${escapeHtml(node.last_error)}</div>
        ${node.error_ts ? `<div style="font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-top:2px">${escapeHtml(formatTs(node.error_ts))}</div>` : ""}
      </div>
    </div>` : "";

  const reflectorSection = (isFailed && (node.reflector_reasoning || rs?.reasoning)) ? `
    <div class="insp-section">
      <div class="sec-label">🧠 Brain LLM Analysis</div>
      <div class="reflector-block">
        <div class="reflector-block-title">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1C3.24 1 1 3.24 1 6s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 7c-1.38 0-2.63-.7-3.36-1.76.02-.87 2.24-1.34 3.36-1.34s3.34.47 3.36 1.34C8.63 9.3 7.38 10 6 10z" fill="#FFAB6A"/></svg>
          Reflector Reasoning
        </div>
        <div class="reflector-block-msg">${escapeHtml(node.reflector_reasoning || rs?.reasoning || "")}</div>
      </div>
    </div>` : "";

  const retrySection = retryHistory.length ? `
    <div class="insp-section">
      <div class="sec-label">Retry History</div>
      <div class="retry-history">
        ${retryHistory.map(r => `
          <div class="retry-entry">
            <span class="re-n">#${escapeHtml(String(r.attempt))}</span>

// ── Capability derivation (unchanged) ────────────
function normalizeCapabilitySource(src) {
  const raw = Array.isArray(src) ? src : Array.isArray(src?.tools) ? src.tools : Array.isArray(src?.capabilities) ? src.capabilities : [];
  return raw.map((item, i) => {
    if (typeof item === "string") return {capability_id:`cap-${i+1}`,title:item,name:item,source:"backend"};
    if (!item||typeof item!=="object") return null;
    const name = item.name||item.title||item.tool_name||item.action_type||item.capability_id||`cap-${i+1}`;
    return {
      capability_id: item.capability_id||item.id||`cap-${i+1}`,
      title: item.title||name, name,
      tool_name: item.tool_name||item.name||null,
      action_types: Array.isArray(item.action_types) ? item.action_types : item.action_type ? [item.action_type] : [],
      node_ids:   Array.isArray(item.node_ids)   ? item.node_ids   : [],
      owners:     (Array.isArray(item.owners)?item.owners:item.owner?[item.owner]:[]).filter(Boolean),
      description: item.description||item.summary||"",
      domains: Array.isArray(item.domains) ? item.domains : [],
      source:  item.source||"backend",
    };
  }).filter(Boolean);
}

function deriveCapabilitiesFromGraph(graph) {
  const map = new Map();
  (graph?.nodes||[]).forEach(n => {
    const key = n.tool_name||n.action_type||n.kind;
    if (!key) return;
    const e = map.get(key) || {capability_id:`derived-${key}`,title:key,name:key,tool_name:n.tool_name||null,action_types:new Set(),node_ids:[],owners:new Set(),statuses:{},inputs:{},outputs:{},source:"derived"};
    e.action_types.add(n.action_type||n.kind||key);
    e.node_ids.push(n.node_id);
    e.owners.add(n.owner||"supervisor");
    e.statuses[n.status||"planned"] = (e.statuses[n.status||"planned"]||0)+1;
    if (!Object.keys(e.inputs).length)  e.inputs  = n.inputs  || {};
    if (!Object.keys(e.outputs).length) e.outputs = n.outputs || {};
    map.set(key, e);
  });
  return Array.from(map.values()).map(e=>({...e,action_types:Array.from(e.action_types),owners:Array.from(e.owners),node_count:e.node_ids.length,status_summary:e.statuses})).sort((a,b)=>b.node_count-a.node_count);
}

function deriveCapabilities() {
  for (const src of [state.toolCatalog,state.session?.capabilities,state.graph?.capabilities,state.session?.tool_catalog]) {
    const n = normalizeCapabilitySource(src);
    if (n.length) return n;
  }
  return deriveCapabilitiesFromGraph(state.graph);
}

// ── Execution helpers ─────────────────────────────
function topologicalOrder(g) { return g.nodes.slice(); }
function isRunnable(n, byId) {
  if (!n || n.status==="succeeded" || n.status==="running") return false;
  return (n.depends_on||[]).map(d=>byId.get(d)).filter(Boolean).every(u=>u.status==="succeeded");
}
function nextRunnableNode() {
  const byId = new Map(state.graph.nodes.map(n=>[n.node_id,n]));
  return state.graph.nodes.find(n=>n.status==="running") || topologicalOrder(state.graph).find(n=>isRunnable(n,byId)) || null;
}

function advanceExecution() {
  const next = nextRunnableNode();
  if (!next) { state.lastAction = "No runnable node found."; renderAll(); return; }
  next.status = "running";
  state.selectedNodeId = next.node_id;
  renderAll();
  setTimeout(() => {
    const n = nodeById(next.node_id);
    if (n) { n.status = "succeeded"; state.lastAction = `Local: executed ${next.node_id}.`; }
    renderAll();
  }, 900);
}

function applyLatestProposal() {
  const ps = state.graph.proposals || [];
  if (!ps.length) { state.lastAction = "No proposals to apply."; renderAll(); return; }
  const p = ps[ps.length-1];
  state.graph.patch_history.push({...p, result:"applied", timestamp:new Date().toISOString()});
  state.graph.proposals = ps.slice(0,-1);
  state.lastAction = `Applied: "${p.reason}"`;
  renderAll();
}

async function loadFromApi() {
  const [sR,gR,eR,tR,dR,cR,bR,pR] = await Promise.allSettled([
    fetchJson("/api/session"), fetchJson("/api/graph"), fetchJson("/api/events"),
    fetchJson("/api/tools"),   fetchJson("/api/domains"), fetchJson("/api/capabilities"),
    fetchJson("/api/tools/bridge/health"), fetchJson("/api/planner/health"),
  ]);
  if (sR.status==="fulfilled"||gR.status==="fulfilled"||eR.status==="fulfilled") {
    state.connected=true; state.source="api";
    const sp = sR.status==="fulfilled" ? sR.value : null;
    const gp = gR.status==="fulfilled" ? gR.value : null;
    applySnapshot({
      session: normalizeSessionPayload(sp)||normalizeSessionPayload(sp?.session)||sp,
      graph:   normalizeGraphPayload(gp)||normalizeGraphPayload(sp?.graph)||gp,
      events:  normalizeEventsPayload(eR.status==="fulfilled"?eR.value:[]),
    }, "api");
    state.toolCatalog      = tR.status==="fulfilled" ? tR.value?.tools||[]  : [];
    state.domainCatalog    = dR.status==="fulfilled" ? dR.value?.domains||{}: {};
    state.capabilitySummary= cR.status==="fulfilled" ? cR.value||{capabilities:[],tool_capabilities:{},domain_capabilities:{}} : {capabilities:[],tool_capabilities:{},domain_capabilities:{}};
    state.bridgeHealth     = bR.status==="fulfilled" ? bR.value||null : null;
    state.plannerHealth    = pR.status==="fulfilled" ? pR.value||null : null;
    state.session.tool_catalog = state.toolCatalog;
    state.session.capabilities = state.capabilitySummary?.capabilities||[];
    if (!state.graph.nodes.some(n=>n.node_id===state.selectedNodeId)) state.selectedNodeId=state.graph.nodes[0]?.node_id||null;
    state.lastAction="Loaded backend snapshot."; return;
  }
  throw new Error("Cannot reach backend.");
}

  catch(err) { console.error(err); applySnapshot(fallbackSnapshot,"fallback"); state.lastAction="Demo mode."; }

  state.session.chat_history = [...(state.session.chat_history||[]), {role:"user",content:msg}];

  setBusy(true, "Thinking…");
  try {
    const r = await fetchJson("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg})});
    if (r.session||r.graph) {
      applySnapshot({session:r.session||state.session,graph:r.graph||state.graph,events:r.graph?.events||state.events},"api");
    } else {

      if (Array.isArray(r.chat_history)) state.session.chat_history = r.chat_history;

    state.connected=true; state.source="api";
  } catch(err) {
    console.error(err);
    state.session.chat_history = [...state.session.chat_history,{role:"assistant",content:"Backend unavailable — running in demo mode."}];
    state.connected=false; state.source="fallback";

  renderAll(); setBusy(false);

/* ══════════════════════════════════════
   PANEL RESIZE LOGIC
══════════════════════════════════════ */
(function() {
  const workspace = document.querySelector('.workspace');
  const centerCol = document.querySelector('.center-column');
  const graphPanel = document.querySelector('.graph-panel');

  // ── Column resize (left | center | right) ──────────
  function setupColResize(handleId, side) {
    const handle = document.getElementById(handleId);
    if (!handle || !workspace) return;

    handle.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      handle.classList.add('dragging');
      document.body.classList.add('resizing');
      handle.setPointerCapture(e.pointerId);

      const startX     = e.clientX;
      const totalW     = workspace.getBoundingClientRect().width;
      // Read current pixel values
      const cs         = getComputedStyle(workspace);
      const cols       = cs.gridTemplateColumns.split(' ');
      // cols = [leftPx, 4px, centerPx, 4px, rightPx]
      const startLeft  = parseFloat(cols[0]);
      const startRight = parseFloat(cols[4]);

      function onMove(ev) {
        const dx = ev.clientX - startX;
        const HANDLE_W = 4 * 2; // two handles = 8px total
        const MIN = 200;

        if (side === 'left') {
          const newLeft   = Math.max(MIN, Math.min(startLeft + dx, totalW - startRight - HANDLE_W - MIN));
          workspace.style.setProperty('--col-left', newLeft + 'px');
        } else {
          const newRight  = Math.max(MIN, Math.min(startRight - dx, totalW - startLeft - HANDLE_W - MIN));
          workspace.style.setProperty('--col-right', newRight + 'px');
        }
      }

      function onUp() {
        handle.classList.remove('dragging');
        document.body.classList.remove('resizing');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp, { once: true });
    });
  }

  // ── Row resize (graph | viewer) ───────────────────
  function setupRowResize(handleId) {
    const handle = document.getElementById(handleId);
    if (!handle || !centerCol || !graphPanel) return;

    handle.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      handle.classList.add('dragging');
      document.body.classList.add('resizing-row');
      handle.setPointerCapture(e.pointerId);

      const startY      = e.clientY;
      const centerH     = centerCol.getBoundingClientRect().height;
      const startGraphH = graphPanel.getBoundingClientRect().height;

      function onMove(ev) {
        const dy       = ev.clientY - startY;
        const MIN      = 100;
        const HANDLE_H = 9;
        const newH     = Math.max(MIN, Math.min(startGraphH + dy, centerH - HANDLE_H - MIN));
        const pct      = (newH / centerH * 100).toFixed(2) + '%';
        graphPanel.style.height = pct;
        centerCol.style.setProperty('--row-graph', pct);
      }

      function onUp() {
        handle.classList.remove('dragging');
        document.body.classList.remove('resizing-row');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp, { once: true });
    });
  }

  // Init after DOM ready
  setupColResize('resize-col-left',  'left');
  setupColResize('resize-col-right', 'right');
  setupRowResize('resize-row-center');
})();

function renderReflectorBanner() {
  const el = document.getElementById('reflector-banner');
  if (!el) return;
  const rs = state.reflectorState;
  if (!rs || !rs.active || state.reflectorDismissed) {
    el.classList.add('hidden');
    return;
  }
  el.classList.remove('hidden');
  const phaseLabel = {
    reflecting: '🧠 Brain LLM analyzing error…',
    retrying:   '↺ Retrying node from adjusted parameters…',
    resolved:   '✓ Error resolved — pipeline resumed',
  }[rs.phase] || rs.phase;
  const node = nodeById(rs.node_id);
  el.innerHTML = `
    <div class="reflector-spinner"></div>
    <div class="reflector-banner-text">
      <div class="reflector-banner-title">${escapeHtml(phaseLabel)}</div>
      <div class="reflector-banner-sub">Node: ${escapeHtml(rs.node_id)}${rs.attempt ? ' · Attempt #' + rs.attempt : ''} — ${escapeHtml(rs.reasoning || '')}</div>
    </div>
    <div class="reflector-banner-actions">
      <button class="banner-btn accept" id="reflector-retry-btn">Retry Now</button>
      <button class="banner-btn dismiss" id="reflector-dismiss-btn">Dismiss</button>
    </div>
  `;
  document.getElementById('reflector-retry-btn')?.addEventListener('click', async () => {
    await executeNextFromReflector();
  });

}

async function executeNextFromReflector() {
  const rs = state.reflectorState;
  if (!rs) return;
  setBusy(true, 'Retrying failed node…');
  try {
    const r = await fetchJson('/api/execute/next', { method: 'POST' });
    if (r.session || r.graph) {
      applySnapshot({ session: r.session||state.session, graph: r.graph||state.graph, events: r.graph?.events||state.events }, 'api');
      state.reflectorState = null;
      renderAll(); setBusy(false); return;
    }
  } catch(err) { console.error(err); }
  // Local simulation: move failed → retrying → succeeded
  const node = nodeById(rs.node_id);
  if (node) {
    node.status = 'retrying';
    state.reflectorState = { ...rs, phase: 'retrying' };
    renderAll();
    setTimeout(() => {
      const n2 = nodeById(rs.node_id);
      if (n2) {
        n2.status = 'succeeded';
        n2.retry_count = (n2.retry_count || 0) + 1;
        (n2.retry_history = n2.retry_history || []).push({ attempt: rs.attempt, ts: new Date().toISOString(), status: 'succeeded', error: null });
      }
      state.reflectorState = { ...rs, phase: 'resolved', active: false };
      state.reflectorDismissed = false;
      state.session.chat_history = [...(state.session.chat_history||[]),
        { role: 'reflector', content: '✓ Retry #' + rs.attempt + ' succeeded for node ' + rs.node_id + '.\n\nThe voxel resampling pre-step resolved the size mismatch. ADC registered to T2w space successfully. Pipeline resuming from segment_prostate.' }
      ];
      renderAll();
      setBusy(false);
    }, 1200);
  } else {
    setBusy(false);
  }
}

</script>
